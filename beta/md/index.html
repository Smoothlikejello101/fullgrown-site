<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Test FullGrown · Beta sign-up</title>
<!-- How the page looks when shared (Facebook, texts and the like): its own picture, not the app icon blown up. No og:url, and no canonical link: shared, the short link stays itself, so the sign-up still says which society it came from. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="FullGrown">
<meta property="og:title" content="Test FullGrown · Beta sign-up">
<meta property="og:description" content="Sign up to test FullGrown, a garden planner built on sourced plant facts, on your own yard before it launches. Free during the beta, and a free year after for testers who help shape it.">
<meta property="og:image" content="https://fullgrown.garden/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="FullGrown: see what will grow in each spot of your yard. A garden plan drawn by FullGrown, with plants at their full-grown size.">
<meta name="twitter:card" content="summary_large_image">
<!-- A society's short link: on to the one sign-up page, which fills in how they heard (see the script there). -->
<meta http-equiv="refresh" content="0; url=/beta/?from=md">
</head>
<body>
<p><a href="/beta/?from=md">Sign up to test FullGrown</a></p>
</body>
</html>
